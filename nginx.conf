# 文档站独立镜像：只提供 /docs/，由 service 的 frontend nginx 反代。
# 同源保留 /docs/ 前缀，文档里的 /app/* 与 /api/docs 链接才能继续工作。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 直接访问文档容器时也给一个入口
    location = / {
        absolute_redirect off;
        return 308 /docs/;
    }

    location = /docs {
        absolute_redirect off;
        return 308 /docs/;
    }

    # VitePress 的带 hash 静态资源可以长缓存
    location /docs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # VitePress 自带 404 页面，不要回落到控制台 SPA
    location /docs/ {
        absolute_redirect off;
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
    }

    location / {
        return 404;
    }

    # 基础安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
