name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  # main/dev 的推送可能正在发布镜像；工作流级取消会打断 image job。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

env:
  NODE_VERSION: '22'

jobs:
  # ---------- 格式检查、生成与构建 ----------
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 固定，避免 action 与
      # packageManager 同时指定导致 "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # 生成 API 页并构建；VitePress 会检查站内死链。
      - name: Build
        run: pnpm build

  # ---------- 构建并推送文档镜像（main / dev）----------
  image:
    name: Build and push image
    needs: check
    if: >-
      ${{ github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/portcloud-notify-docs:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/portcloud-notify-docs:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          cache-from: type=gha,scope=${{ github.ref_name }}-docs
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-docs
